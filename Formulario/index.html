<!DOCTYPE html>
<html lang="pt br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Cadastro de veiculo </h1>
      
      <form action="" method="post">
        <div>
            <label for=""> Nome do Proprietario </label> </div>
            <div><input type="text" name="" id="" placeholder="Nome"></div>
           
            <div>
              <label for=""> E-mail </label></div>
              <div><input type="email" placeholder="E-mail"></div>

            <div>
              <label for=""> Telefone </label> </div>
              <div><input type="text" placeholder="Telefone"></div>
              
             <div>
              <label for=""> Data de Nascimento </label></div>
              <div> <input type="date" name="" id=""> </div>

              <div>
                <label for="">Modelo do veiculo</label></div>
                <div> <input type="text" placeholder="Modelo veiculo"></div>

              <div>
                <label for="">Fabricante:</label>
              </div>
              <div>
                <select name="" id="">
                 <div> <option value=""> Honda</option></div>
                 <div><option value=""> Chevrolet</option></div>
                 <div><option value=""> Nissan</option></div>
                 <div><option value=""> Bmw</option></div>
                 <div><option value=""> Mercedes</option></div>
                </select>
              </div>

                <div>
                  <label for=""> Combustivel </label>
                </div>

                <div> <input type="radio" name="rbcombustivel"> <span>Gasolina </span> </div> 
                <div><input type="radio" name="rbcombustivel"> <span>Álcool </span></div>
                <div><input type="radio" name="rbcombustivel"> <span>Diesel </span></div>
                <div><input type="radio" name="rbcombustivel"> <span>Eletrico </span></div>
                <div><input type="radio" name="rbcombustivel"> <span>Hibrido </span></div>

                <div> 
                  <label for=""> Preferencias </label>
                </div>

                <div> <input type="checkbox"> <span>Passeio</span></div>
                <div> <input type="checkbox"> <span>Trabalho</span></div>

                <div><input type="submit" value="Enviar"></div>
              
      </form>

</body>
</html>
